<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sem conexão — Molduras IA</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(0,104,5,.25), transparent 60%),
      #0A0C10;
    color:#F5F5F7;
    min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;text-align:center;
  }
  .box{
    max-width:400px;
    background:linear-gradient(180deg,rgba(20,24,33,.95),rgba(20,24,33,.85));
    border:1px solid rgba(255,255,255,.1);
    border-radius:24px;
    padding:36px 28px;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  .icon{
    width:72px;height:72px;margin:0 auto 20px;
    border-radius:20px;
    background:linear-gradient(135deg,#006805,#71BF50);
    display:grid;place-items:center;font-size:36px;
  }
  h1{font-size:22px;font-weight:700;margin-bottom:10px;letter-spacing:-.4px}
  p{font-size:14px;color:#8B93A1;line-height:1.6;margin-bottom:24px}
  button{
    background:linear-gradient(135deg,#006805,#004d04);
    color:#fff;border:none;padding:14px 28px;
    border-radius:14px;font-size:15px;font-weight:600;
    cursor:pointer;font-family:inherit;
    box-shadow:0 6px 20px rgba(0,104,5,.4);
    transition:transform .15s;
  }
  button:active{transform:scale(.96)}
</style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>Você está offline</h1>
    <p>O aplicativo precisa de conexão na primeira vez para baixar os modelos de IA. Depois disso, funciona 100% offline.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
