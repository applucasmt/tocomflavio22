<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0C10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Criador de Molduras com IA — grátis, open source, roda no navegador">
<title>Molduras IA — Criador Profissional</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://esm.sh">

<style>
/* ============================================================
   DESIGN SYSTEM — Dark Premium
   ============================================================ */
:root{
  --primary:#006805;
  --primary-glow:rgba(0,104,5,.4);
  --secondary:#71BF50;
  --accent:#FECD29;
  --purple:#8B5CF6;
  --pink:#EC4899;
  --bg:#0A0C10;
  --surface:#141821;
  --surface-2:#1E232E;
  --surface-3:#2A303C;
  --text:#F5F5F7;
  --text-sub:#8B93A1;
  --border:rgba(255,255,255,.06);
  --border-bright:rgba(255,255,255,.12);
  --success:#22C55E;
  --danger:#EF4444;
  --shadow:0 8px 32px rgba(0,0,0,.5);
  --shadow-lg:0 20px 60px rgba(0,0,0,.7);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(1400px 700px at 15% -20%, rgba(0,104,5,.28), transparent 55%),
    radial-gradient(1000px 600px at 100% 110%, rgba(139,92,246,.18), transparent 55%),
    radial-gradient(800px 400px at 50% 50%, rgba(254,205,41,.06), transparent 60%),
    var(--bg);
  color:var(--text);
  min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:16px;overflow-x:hidden;
}

/* ============================================================
   APP
   ============================================================ */
.app{
  width:100%;max-width:520px;
  background:linear-gradient(180deg, rgba(20,24,33,.92), rgba(20,24,33,.78));
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--border-bright);
  border-radius:28px;
  box-shadow:var(--shadow-lg);
  overflow:hidden;
  display:flex;flex-direction:column;
  animation:appIn .6s cubic-bezier(.2,.9,.3,1.15);
}
@keyframes appIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}

/* ============================================================
   HEADER
   ============================================================ */
.header{
  padding:20px 22px 14px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{
  width:42px;height:42px;border-radius:13px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  display:grid;place-items:center;
  box-shadow:0 4px 16px var(--primary-glow);
  position:relative;overflow:hidden;
}
.brand-logo::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.3) 50%,transparent 60%);
  animation:shine 3s infinite;
}
@keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.brand-logo svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.brand-text h1{font-size:16px;font-weight:700;letter-spacing:-.3px}
.brand-text p{font-size:11.5px;color:var(--text-sub);font-weight:500}

.pill{
  display:flex;align-items:center;gap:6px;
  padding:6px 11px;border-radius:999px;
  background:rgba(113,191,80,.1);
  border:1px solid rgba(113,191,80,.25);
  font-size:11px;font-weight:600;color:var(--secondary);
  letter-spacing:.3px;
}
.pill .dot{
  width:6px;height:6px;border-radius:50%;background:var(--secondary);
  box-shadow:0 0 10px var(--secondary);
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}

/* ============================================================
   STAGE
   ============================================================ */
.stage{
  position:relative;width:100%;aspect-ratio:1/1;
  background:repeating-conic-gradient(#141821 0% 25%, #1A1F2B 0% 50%) 50%/24px 24px;
  overflow:hidden;touch-action:none;cursor:grab;user-select:none;
}
.stage.dragging{cursor:grabbing}
.stage.drag-over::after{
  content:"✨ Solte para carregar";
  position:absolute;inset:16px;
  border:2px dashed var(--secondary);border-radius:18px;
  display:grid;place-items:center;
  background:rgba(113,191,80,.12);
  backdrop-filter:blur(8px);
  color:var(--secondary);font-weight:600;font-size:15px;
  z-index:30;pointer-events:none;
}
#canvas{display:block;width:100%;height:100%;object-fit:contain}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:5}
#cameraOverlay{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;z-index:6;pointer-events:none;
}
#captureBtn{
  position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  z-index:10;width:calc(100% - 40px);max-width:280px;
}

.placeholder{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;color:var(--text-sub);
  pointer-events:none;z-index:2;
  text-align:center;padding:24px;
}
.placeholder svg{
  width:60px;height:60px;opacity:.35;
  stroke:currentColor;fill:none;stroke-width:1.5;
  animation:float 3s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.placeholder .p-title{font-weight:600;color:var(--text);font-size:15.5px}
.placeholder .p-sub{font-size:12.5px;max-width:260px;line-height:1.55}

/* ============================================================
   LOADER
   ============================================================ */
.loader{
  position:absolute;inset:0;z-index:50;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;
  background:rgba(10,12,16,.88);
  backdrop-filter:blur(16px);
}
.loader.active{display:flex}
.spinner{
  width:52px;height:52px;border-radius:50%;
  border:3px solid rgba(255,255,255,.08);
  border-top-color:var(--secondary);
  animation:spin .9s linear infinite;
  position:relative;
}
.spinner::after{
  content:"";position:absolute;inset:8px;border-radius:50%;
  border:2px solid transparent;border-top-color:var(--accent);
  animation:spin 1.4s linear infinite reverse;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{font-size:13px;color:var(--text-sub);font-weight:500;text-align:center;padding:0 24px}
.loader-progress{
  width:200px;height:3px;border-radius:2px;
  background:rgba(255,255,255,.08);overflow:hidden;
}
.loader-progress-bar{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--secondary),var(--accent));
  border-radius:2px;transition:width .3s;
}

/* ============================================================
   HINT + ZOOM
   ============================================================ */
.hint{
  text-align:center;font-size:12px;color:var(--text-sub);
  padding:10px 24px 6px;display:none;
}
.hint.show{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.zoom-bar{display:flex;align-items:center;gap:12px;padding:0 24px 12px;}
.zoom-bar input[type=range]{
  flex:1;-webkit-appearance:none;appearance:none;
  height:4px;border-radius:2px;background:var(--surface-2);outline:none;
}
.zoom-bar input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:18px;height:18px;border-radius:50%;
  background:linear-gradient(135deg,var(--secondary),var(--primary));
  cursor:pointer;box-shadow:0 2px 10px rgba(113,191,80,.5);
  border:2px solid #fff;
}
.zoom-bar input[type=range]::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;
  background:var(--secondary);cursor:pointer;border:2px solid #fff;
}
.zoom-bar .z-label{font-size:11px;color:var(--text-sub);font-weight:600;min-width:36px;text-align:center}

/* ============================================================
   FRAMES
   ============================================================ */
.frames-label{
  padding:0 24px 8px;
  font-size:11px;font-weight:700;color:var(--text-sub);
  text-transform:uppercase;letter-spacing:.8px;
  display:flex;align-items:center;justify-content:space-between;
}
.frames{
  display:flex;gap:12px;overflow-x:auto;
  padding:0 24px 20px;
  scroll-snap-type:x mandatory;scrollbar-width:none;
}
.frames::-webkit-scrollbar{display:none}
.frame{
  flex:0 0 76px;height:76px;border-radius:18px;
  background:var(--surface-2);border:2px solid transparent;
  display:grid;place-items:center;cursor:pointer;
  scroll-snap-align:center;
  transition:all .25s cubic-bezier(.3,.9,.4,1.2);
  position:relative;overflow:hidden;
}
.frame img{
  width:100%;height:100%;object-fit:cover;border-radius:16px;
  opacity:.65;transition:opacity .2s;
}
.frame:hover img{opacity:1}
.frame.active{
  border-color:var(--secondary);transform:scale(1.08);
  box-shadow:0 6px 22px rgba(113,191,80,.4);
}
.frame.active img{opacity:1}
.frame .num{
  position:absolute;bottom:4px;right:6px;
  font-size:10px;font-weight:700;
  background:rgba(0,0,0,.75);color:#fff;
  padding:1px 6px;border-radius:999px;z-index:2;
}
.frame.active .num{background:var(--secondary);color:#0F1115}

/* ============================================================
   CONTROLS
   ============================================================ */
.controls{padding:0 24px 24px;display:flex;flex-direction:column;gap:10px;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn{
  border:none;padding:15px 18px;border-radius:16px;
  font-size:15px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;
  cursor:pointer;transition:transform .12s,opacity .2s,background .2s,box-shadow .2s;
  user-select:none;color:var(--text);font-family:inherit;
  position:relative;overflow:hidden;
}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

.btn-upload{background:var(--surface-2);border:1px solid var(--border-bright)}
.btn-upload:hover{background:var(--surface-3)}
.btn-upload input{position:absolute;inset:0;opacity:0;cursor:pointer}

.btn-camera{
  background:linear-gradient(135deg,var(--accent),#F0B800);
  color:#1C1C1E;box-shadow:0 4px 16px rgba(254,205,41,.3);
}

.btn-primary{
  background:linear-gradient(135deg,var(--primary),#004d04);
  box-shadow:0 6px 22px var(--primary-glow);
  font-size:16px;padding:17px;
}

.btn-ghost{
  background:transparent;border:1px solid var(--border-bright);
  color:var(--text-sub);font-weight:500;
}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}

.btn-ai{
  background:linear-gradient(135deg,var(--purple),var(--pink));
  color:#fff;box-shadow:0 6px 22px rgba(139,92,246,.4);
}

/* ============================================================
   TOAST
   ============================================================ */
.toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(120px);
  background:var(--surface);border:1px solid var(--border-bright);
  padding:13px 20px;border-radius:14px;
  font-size:13.5px;font-weight:500;
  box-shadow:var(--shadow);z-index:9999;
  transition:transform .4s cubic-bezier(.2,.9,.3,1.15);
  max-width:90vw;display:flex;align-items:center;gap:10px;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{border-color:rgba(34,197,94,.4)}
.toast.success::before{content:"✅"}
.toast.error{border-color:rgba(239,68,68,.4)}
.toast.error::before{content:"⚠️"}
.toast.info::before{content:"ℹ️"}

@media (max-width:400px){
  .app{border-radius:22px}
  .header{padding:16px 18px 12px}
  .frames{padding:0 18px 16px}
  .controls{padding:0 18px 18px}
  .zoom-bar{padding:0 18px 10px}
  .frames-label{padding:0 18px 8px}
}
</style>
</head>

  <header class="header">
    <div class="brand">

<!-- ============================================================
     APP PRINCIPAL
     ============================================================ -->
<script>
/* =====================================================================
   CONFIG
   ===================================================================== */
const CANVAS_SIZE = 1080;

// 👉 ADICIONE AS MOLDURAS AQUI (última = padrão)
// Coloque os arquivos na pasta /frames/ do repositório
const FRAMES_URLS = [
  "frames/mold-01.png",
  "frames/mold-02.png",
  "frames/mold-03.png",
  "frames/mold-04.png",
  "frames/mold-05.png",
  "frames/mold-06.png",
  "frames/mold-07.png",
  "frames/mold-08.png"
];

/* =====================================================================
   REFS
   ===================================================================== */
const $ = id => document.getElementById(id);
const canvas = $('canvas');
const ctx = canvas.getContext('2d');
const stage = $('stage');
const fileInput = $('fileInput');
const cameraBtn = $('cameraBtn');
const aiBtn = $('aiBtn');
const downloadBtn = $('downloadBtn');
const resetBtn = $('resetBtn');
const framesEl = $('frames');
const placeholder = $('placeholder');
const loader = $('loader');
const loaderText = $('loaderText');
const loaderBar = $('loaderBar');
const hint = $('hint');
const zoomBar = $('zoomBar');
const zoomSlider = $('zoomSlider');
const zoomLabel = $('zoomLabel');
const toast = $('toast');
const frameCount = $('frameCount');

/* =====================================================================
   STATE
   ===================================================================== */
let originalImage = null;
let imageLoaded = false;
let currentFrameIndex = FRAMES_URLS.length - 1;
let activeFrameImage = new Image();
let isFrameLoaded = false;

let zoomLevel = 1, panX = 0, panY = 0;
let isDragging = false, startX, startY, lastPanX = 0, lastPanY = 0;
let initialDistance = 0, initialZoom = 1, initialPanX = 0, initialPanY = 0;
let zoomCenterX = 0, zoomCenterY = 0;

let cameraStream = null;
let isCameraMode = false;

let faceDetector = null;
let lastFaceBox = null;

/* =====================================================================
   TOAST
   ===================================================================== */
function showToast(msg, type = '') {
  toast.textContent = msg;
  toast.className = 'toast show ' + type;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove('show'), 3000);
}

/* =====================================================================
   LOADER
   ===================================================================== */
function setLoader(active, text = 'Processando...', pct = null) {
  loaderText.textContent = text;
  loader.classList.toggle('active', active);
  if (pct !== null) loaderBar.style.width = pct + '%';
  else loaderBar.style.width = '0%';
}

/* =====================================================================
   FRAMES
   ===================================================================== */
function initFrames() {
  framesEl.innerHTML = '';
  frameCount.textContent = FRAMES_URLS.length + ' disponíveis';

  for (let i = FRAMES_URLS.length - 1; i >= 0; i--) {
    const el = document.createElement('div');
    el.className = 'frame' + (i === currentFrameIndex ? ' active' : '');
    el.dataset.index = i;
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', `Moldura ${i + 1}`);

    const thumb = document.createElement('img');
    thumb.src = FRAMES_URLS[i];
    thumb.alt = `Moldura ${i + 1}`;
    thumb.loading = 'lazy';
    thumb.onerror = () => { el.style.opacity = '.3'; };

    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = i + 1;

    el.appendChild(thumb);
    el.appendChild(num);

    el.addEventListener('click', () => {
      document.querySelectorAll('.frame').forEach(f => f.classList.remove('active'));
      el.classList.add('active');
      currentFrameIndex = i;
      loadFrame();
    });

    framesEl.appendChild(el);
  }
}

function loadFrame() {
  isFrameLoaded = false;
  activeFrameImage = new Image();
  activeFrameImage.crossOrigin = 'anonymous';
  activeFrameImage.onload = () => {
    isFrameLoaded = true;
    const overlay = $('cameraOverlay');
    if (overlay) overlay.src = activeFrameImage.src;
    render();
  };
  activeFrameImage.onerror = () => showToast('Erro ao carregar moldura', 'error');
  activeFrameImage.src = FRAMES_URLS[currentFrameIndex];
}

/* =====================================================================
   RENDER
   ===================================================================== */
function render() {
  ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

  if (imageLoaded && originalImage) {
    placeholder.style.display = 'none';
    hint.classList.add('show');
    zoomBar.style.display = 'flex';
    resetBtn.style.display = 'flex';
    aiBtn.disabled = false;

    const aspect = originalImage.width / originalImage.height;
    let dw, dh;
    if (aspect > 1) { dh = CANVAS_SIZE; dw = CANVAS_SIZE * aspect; }
    else            { dw = CANVAS_SIZE; dh = CANVAS_SIZE / aspect; }

    const fw = dw * zoomLevel;
    const fh = dh * zoomLevel;
    const x = (CANVAS_SIZE - fw) / 2 + panX;
    const y = (CANVAS_SIZE - fh) / 2 + panY;

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
    ctx.clip();
    ctx.drawImage(originalImage, x, y, fw, fh);
    ctx.restore();
  } else {
    placeholder.style.display = 'flex';
    hint.classList.remove('show');
    zoomBar.style.display = 'none';
    resetBtn.style.display = 'none';
    aiBtn.disabled = true;
  }

  if (isFrameLoaded && activeFrameImage.complete) {
    ctx.drawImage(activeFrameImage, 0, 0, CANVAS_SIZE, CANVAS_SIZE);
  }

  downloadBtn.disabled = !imageLoaded;
}

/* =====================================================================
   UPLOAD / CÂMERA
   ===================================================================== */
function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) {
    showToast('Selecione uma imagem válida', 'error'); return;
  }
  setLoader(true, 'Carregando imagem...', 30);
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      originalImage = img;
      imageLoaded = true;
      zoomLevel = 1; panX = 0; panY = 0;
      zoomSlider.value = 1; zoomLabel.textContent = '100%';
      setLoader(false);
      render();
      showToast('Foto carregada!', 'success');
    };
    img.onerror = () => { setLoader(false); showToast('Erro ao carregar', 'error'); };
    img.src = e.target.result;
  };
  reader.onerror = () => { setLoader(false); showToast('Erro ao ler arquivo', 'error'); };
  reader.readAsDataURL(file);
}

/* =====================================================================
   IA: DETECÇÃO FACIAL (auto-enquadramento)
   ===================================================================== */
async function initFaceDetector() {
  if (faceDetector) return faceDetector;
  if (!window.FaceDetector) return null;
  try {
    const vision = await window.FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
    );
    faceDetector = await window.FaceDetector.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite'
      },
      runningMode: 'IMAGE',
      minDetectionConfidence: 0.5
    });
    return faceDetector;
  } catch (e) {
    console.warn('FaceDetector indisponível', e);
    return null;
  }
}

async function autoFrameFace() {
  if (!imageLoaded || !originalImage) return;
  const detector = await initFaceDetector();
  if (!detector) return;

  try {
    // Cria canvas temporário para detecção
    const tmp = document.createElement('canvas');
    const scale = 640 / Math.max(originalImage.width, originalImage.height);
    tmp.width = originalImage.width * scale;
    tmp.height = originalImage.height * scale;
    tmp.getContext('2d').drawImage(originalImage, 0, 0, tmp.width, tmp.height);

    const result = detector.detect(tmp);
    if (!result.detections || result.detections.length === 0) return;

    // Pega o rosto maior (mais próximo da câmera)
    const faces = result.detections.map(d => d.boundingBox);
    faces.sort((a, b) => (b.width * b.height) - (a.width * a.height));
    const face = faces[0];

    // Centro do rosto em coordenadas normalizadas
    const faceCX = (face.originX + face.width / 2) / tmp.width;
    const faceCY = (face.originY + face.height / 2) / tmp.height;

    // Ajusta pan para centralizar o rosto
    const imgAspect = originalImage.width / originalImage.height;
    let dw, dh;
    if (imgAspect > 1) { dh = CANVAS_SIZE; dw = CANVAS_SIZE * imgAspect; }
    else               { dw = CANVAS_SIZE; dh = CANVAS_SIZE / imgAspect; }

    // Zoom automático para o rosto ocupar ~50% do quadro
    const faceSizeNorm = Math.max(face.width / tmp.width, face.height / tmp.height);
    const targetFaceSize = 0.5;
    if (faceSizeNorm > 0 && faceSizeNorm < targetFaceSize) {
      zoomLevel = Math.min(targetFaceSize / faceSizeNorm, 2.5);
    }

    // Centraliza
    const fw = dw * zoomLevel;
    const fh = dh * zoomLevel;
    panX = (0.5 - faceCX) * fw;
    panY = (0.5 - faceCY) * fh;

    zoomSlider.value = zoomLevel;
    zoomLabel.textContent = Math.round(zoomLevel * 100) + '%';
    render();
    showToast('✨ Rosto centralizado automaticamente!', 'success');
  } catch (e) {
    console.warn('Auto-frame falhou', e);
  }
}

/* =====================================================================
   IA: REMOÇÃO DE FUNDO (imgly U²-Net)
   ===================================================================== */
async function removeBgWithAI() {
  if (!imageLoaded || !originalImage) return;

  setLoader(true, 'IA analisando a imagem...', 10);

  try {
    if (typeof window.removeBackground !== 'function') {
      throw new Error('Biblioteca IA ainda carregando. Aguarde alguns segundos.');
    }

    // Converte para Blob
    const off = document.createElement('canvas');
    off.width = originalImage.width;
    off.height = originalImage.height;
    off.getContext('2d').drawImage(originalImage, 0, 0);
    const blob = await new Promise(res => off.toBlob(res, 'image/png'));

    setLoader(true, 'IA removendo o fundo...', 30);

    const resultBlob = await window.removeBackground(blob, {
      output: { format: 'image/png', quality: 1 },
      progress: (key, current, total) => {
        const pct = 30 + Math.round((current / total) * 65);
        setLoader(true, `IA processando... ${Math.round((current/total)*100)}%`, pct);
      }
    });

    const url = URL.createObjectURL(resultBlob);
    const img = new Image();
    img.onload = () => {
      originalImage = img;
      URL.revokeObjectURL(url);
      setLoader(false);
      render();
      showToast('✨ Fundo removido com sucesso!', 'success');
    };
    img.onerror = () => { setLoader(false); showToast('Erro no processamento', 'error'); };
    img.src = url;

  } catch (err) {
    console.error(err);
    setLoader(false);
    showToast(err.message || 'Erro ao remover fundo', 'error');
  }
}

/* =====================================================================
   CÂMERA
   ===================================================================== */
function stopCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  $('video')?.remove();
  $('cameraOverlay')?.remove();
  $('captureBtn')?.remove();
  isCameraMode = false;
}

function openCamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    showToast('Câmera não suportada', 'error'); return;
  }
  stopCamera();

  const video = document.createElement('video');
  video.id = 'video';
  video.setAttribute('playsinline', '');
  video.setAttribute('autoplay', '');
  video.muted = true;

  const overlay = document.createElement('img');
  overlay.id = 'cameraOverlay';
  if (isFrameLoaded) overlay.src = activeFrameImage.src;

  stage.appendChild(video);
  stage.appendChild(overlay);

  navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: 1080 }, height: { ideal: 1080 } },
    audio: false
  })
  .then(stream => {
    cameraStream = stream;
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      video.play();
      isCameraMode = true;

      const btn = document.createElement('button');
      btn.id = 'captureBtn';
      btn.className = 'btn btn-primary';
      btn.innerHTML = '📸 Capturar';
      stage.appendChild(btn);

      btn.addEventListener('click', () => {
        const tmp = document.createElement('canvas');
        tmp.width = CANVAS_SIZE;
        tmp.height = CANVAS_SIZE;
        const tctx = tmp.getContext('2d');
        const size = Math.min(video.videoWidth, video.videoHeight);
        const sx = (video.videoWidth - size) / 2;
        const sy = (video.videoHeight - size) / 2;
        tctx.drawImage(video, sx, sy, size, size, 0, 0, CANVAS_SIZE, CANVAS_SIZE);

        const img = new Image();
        img.onload = () => {
          originalImage = img;
          imageLoaded = true;
          zoomLevel = 1; panX = 0; panY = 0;
          zoomSlider.value = 1; zoomLabel.textContent = '100%';
          stopCamera();
          render();
        };
        img.src = tmp.toDataURL('image/png');
      });
    };
  })
  .catch(() => {
    showToast('Não foi possível acessar a câmera', 'error');
    stopCamera();
  });
}

/* =====================================================================
   GESTOS
   ===================================================================== */
function getDistance(t) {
  const dx = t[0].clientX - t[1].clientX;
  const dy = t[0].clientY - t[1].clientY;
  return Math.hypot(dx, dy);
}

stage.addEventListener('touchstart', e => {
  if (!imageLoaded || isCameraMode) return;
  e.preventDefault();
  const t = e.touches;
  if (t.length === 1) {
    isDragging = true;
    startX = t[0].clientX; startY = t[0].clientY;
    lastPanX = panX; lastPanY = panY;
  } else if (t.length === 2) {
    isDragging = false;
    initialDistance = getDistance(t);
    initialZoom = zoomLevel;
    const r = stage.getBoundingClientRect();
    const cx = (t[0].clientX + t[1].clientX) / 2;
    const cy = (t[0].clientY + t[1].clientY) / 2;
    zoomCenterX = (cx - r.left) * (CANVAS_SIZE / r.width) - CANVAS_SIZE / 2;
    zoomCenterY = (cy - r.top)  * (CANVAS_SIZE / r.height) - CANVAS_SIZE / 2;
    initialPanX = panX; initialPanY = panY;
  }
}, { passive: false });

stage.addEventListener('touchmove', e => {
  if (!imageLoaded || isCameraMode) return;
  e.preventDefault();
  const t = e.touches;
  if (t.length === 1 && isDragging) {
    const r = stage.getBoundingClientRect();
    panX = lastPanX + (t[0].clientX - startX) * (CANVAS_SIZE / r.width);
    panY = lastPanY + (t[0].clientY - startY) * (CANVAS_SIZE / r.height);
    render();
  } else if (t.length === 2) {
    const dist = getDistance(t);
    const scale = dist / initialDistance;
    const newZoom = Math.min(Math.max(initialZoom * scale, 0.5), 4);
    const d = newZoom - initialZoom;
    panX = initialPanX - d * zoomCenterX;
    panY = initialPanY - d * zoomCenterY;
    zoomLevel = newZoom;
    zoomSlider.value = zoomLevel;
    zoomLabel.textContent = Math.round(zoomLevel * 100) + '%';
    render();
  }
}, { passive: false });

stage.addEventListener('touchend', () => { isDragging = false; });

let mouseDragging = false, mStartX, mStartY;
stage.addEventListener('mousedown', e => {
  if (!imageLoaded || isCameraMode) return;
  mouseDragging = true;
  mStartX = e.clientX; mStartY = e.clientY;
  lastPanX = panX; lastPanY = panY;
  stage.classList.add('dragging');
});
window.addEventListener('mousemove', e => {
  if (!mouseDragging || !imageLoaded || isCameraMode) return;
  const r = stage.getBoundingClientRect();
  panX = lastPanX + (e.clientX - mStartX) * (CANVAS_SIZE / r.width);
  panY = lastPanY + (e.clientY - mStartY) * (CANVAS_SIZE / r.height);
  render();
});
window.addEventListener('mouseup', () => {
  if (mouseDragging) {
    mouseDragging = false;
    stage.classList.remove('dragging');
  }
});

stage.addEventListener('wheel', e => {
  if (!imageLoaded || isCameraMode) return;
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.08 : 0.08;
  const newZoom = Math.min(Math.max(zoomLevel + delta, 0.5), 4);
  const r = stage.getBoundingClientRect();
  const cx = (e.clientX - r.left) * (CANVAS_SIZE / r.width) - CANVAS_SIZE / 2;
  const cy = (e.clientY - r.top)  * (CANVAS_SIZE / r.height) - CANVAS_SIZE / 2;
  const d = newZoom - zoomLevel;
  panX -= d * cx; panY -= d * cy;
  zoomLevel = newZoom;
  zoomSlider.value = zoomLevel;
  zoomLabel.textContent = Math.round(zoomLevel * 100) + '%';
  render();
}, { passive: false });

zoomSlider.addEventListener('input', e => {
  if (!imageLoaded) return;
  zoomLevel = parseFloat(e.target.value);
  zoomLabel.textContent = Math.round(zoomLevel * 100) + '%';
  render();
});

/* =====================================================================
   DRAG & DROP
   ===================================================================== */
['dragenter', 'dragover'].forEach(ev => {
  stage.addEventListener(ev, e => {
    e.preventDefault();
    stage.classList.add('drag-over');
  });
});
['dragleave', 'drop'].forEach(ev => {
  stage.addEventListener(ev, e => {
    e.preventDefault();
    stage.classList.remove('drag-over');
  });
});
stage.addEventListener('drop', e => {
  const file = e.dataTransfer?.files?.[0];
  if (file) { if (isCameraMode) stopCamera(); handleFile(file); }
});

/* =====================================================================
   EVENTOS
   ===================================================================== */
fileInput.addEventListener('change', function() {
  if (this.files?.[0]) {
    if (isCameraMode) stopCamera();
    handleFile(this.files[0]);
  }
});

cameraBtn.addEventListener('click', openCamera);

aiBtn.addEventListener('click', async () => {
  await removeBgWithAI();
  await autoFrameFace();
});

resetBtn.addEventListener('click', () => {
  if (isCameraMode) stopCamera();
  originalImage = null;
  imageLoaded = false;
  fileInput.value = '';
  zoomLevel = 1; panX = 0; panY = 0;
  zoomSlider.value = 1; zoomLabel.textContent = '100%';
  render();
});

/* =====================================================================
   DOWNLOAD / SHARE
   ===================================================================== */
downloadBtn.addEventListener('click', async () => {
  if (!imageLoaded) return;
  const original = downloadBtn.innerHTML;
  downloadBtn.innerHTML = '⏳ Processando...';
  downloadBtn.disabled = true;

  try {
    const dataUrl = canvas.toDataURL('image/png', 1.0);
    const arr = dataUrl.split(',');
    const mime = arr[0].match(/:(.*?);/)[1];
    const bstr = atob(arr[1]);
    let n = bstr.length;
    const u8 = new Uint8Array(n);
    while (n--) u8[n] = bstr.charCodeAt(n);
    const fileName = `moldura_${Date.now()}.png`;
    const file = new File([u8], fileName, { type: mime });

    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    if (isMobile && navigator.canShare?.({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: 'Minha Foto' });
        success();
      } catch (err) {
        if (err.name !== 'AbortError') fallback(file, fileName);
        else reset();
      }
    } else {
      fallback(file, fileName);
    }
  } catch (err) {
    console.error(err);
    showToast('Erro ao processar imagem', 'error');
    reset();
  }

  function fallback(fileObj, name) {
    const url = URL.createObjectURL(fileObj);
    const a = document.createElement('a');
    a.style.display = 'none';
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      success();
    }, 200);
  }
  function success() {
    downloadBtn.innerHTML = '✅ Concluído!';
    downloadBtn.style.background = 'linear-gradient(135deg, #22C55E, #16A34A)';
    showToast('Imagem salva!', 'success');
    setTimeout(reset, 2000);
  }
  function reset() {
    downloadBtn.innerHTML = original;
    downloadBtn.style.background = '';
    downloadBtn.disabled = false;
  }
});

/* =====================================================================
   BOOT
   ===================================================================== */
window.addEventListener('load', () => {
  initFrames();
  loadFrame();
  // Pré-carrega o detector facial em background
  initFaceDetector();
});
</script>
