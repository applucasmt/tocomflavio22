<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0C10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Molduras IA">
<meta name="application-name" content="Molduras IA">
<meta name="format-detection" content="telephone=no">
<meta name="msapplication-TileColor" content="#006805">
<meta name="description" content="Criador de molduras com IA — grátis, open source, roda 100% no navegador">
<meta name="author" content="Criador de Molduras IA">
<meta name="keywords" content="moldura, foto, ia, molduras, editor de foto, retrato profissional">
<meta property="og:title" content="Criador de Molduras IA">
<meta property="og:description" content="Adicione molduras profissionais em suas fotos com IA">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Criador de Molduras IA">
<meta name="twitter:description" content="Adicione molduras profissionais em suas fotos com IA">

<title>Criador de Molduras IA</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23006805'/%3E%3Cpath d='M6 6h4v4H6zM14 6h4v4h-4zM6 14h4v4H6zM14 14h4v4h-4z' fill='%2371BF50'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23006805'/%3E%3Cpath d='M6 6h4v4H6zM14 6h4v4h-4zM6 14h4v4H6zM14 14h4v4h-4z' fill='%2371BF50'/%3E%3C/svg%3E">

<link rel="manifest" href="manifest.json">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://storage.googleapis.com" crossorigin>
<link rel="preconnect" href="https://image.pollinations.ai" crossorigin>

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <header class="header">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>Criador de Molduras</h1>
        <p>Powered by IA • Open Source</p>
      </div>
    </div>
    <div class="pill" id="statusPill" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span>IA</span>
    </div>
  </header>

  <div class="stage" id="stage" role="region" aria-label="Área de edição da foto">
    <canvas id="canvas" width="1080" height="1080" aria-label="Pré-visualização da moldura"></canvas>

    <div class="placeholder" id="placeholder" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
      <div class="p-title">Adicione sua foto</div>
      <div class="p-sub">Galeria, câmera ou arraste uma imagem</div>
    </div>

    <div class="loader" id="loader" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <div class="loader-text" id="loaderText">Processando...</div>
      <div class="loader-progress" aria-hidden="true">
        <div class="loader-progress-bar" id="loaderBar"></div>
      </div>
    </div>
  </div>

  <div class="hint" id="hint" role="note">
    👆 Arraste • 🤏 Pinça para zoom
  </div>

  <div class="zoom-bar" id="zoomBar" style="display:none">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" aria-hidden="true"
         style="color:var(--text-sub)">
      <circle cx="11" cy="11" r="7"/>
      <path d="M21 21l-4.35-4.35M8 11h6"/>
    </svg>
    <input type="range" id="zoomSlider" min="0.5" max="4" step="0.01" value="1"
           aria-label="Nível de zoom">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" aria-hidden="true"
         style="color:var(--text-sub)">
      <circle cx="11" cy="11" r="7"/>
      <path d="M21 21l-4.35-4.35M11 8v6M8 11h6"/>
    </svg>
    <span class="z-label" id="zoomLabel" aria-live="polite">100%</span>
  </div>

  <!-- ============ SELETOR DE MOLDURAS (com botão refresh) ============ -->
  <div class="frames-label">
    <span>Molduras</span>
    <span style="display:flex;align-items:center;gap:8px">
      <span style="color:var(--text-sub);font-size:10px" id="frameCount">detectando...</span>
      <button id="refreshFramesBtn" title="Buscar novas molduras"
              style="background:none;border:none;color:var(--text-sub);cursor:pointer;padding:2px;display:grid;place-items:center"
              aria-label="Buscar novas molduras">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 4v6h-6M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
        </svg>
      </button>
    </span>
  </div>
  <div class="frames" id="frames" role="listbox" aria-label="Escolha uma moldura"></div>

  <div class="controls">

    <div class="row">
      <button class="btn btn-upload" id="uploadBtn" aria-label="Escolher foto da galeria">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <path d="M17 8l-5-5-5 5M12 3v12"/>
        </svg>
        <span>Galeria</span>
        <input type="file" id="fileInput" accept="image/*" aria-label="Selecionar arquivo de imagem">
      </button>

      <button class="btn btn-camera" id="cameraBtn" aria-label="Abrir câmera">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        <span>Câmera</span>
      </button>
    </div>

    <button class="btn btn-ai" id="generateBtn" disabled
            aria-label="Gerar versão profissional com IA">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4-6.3-4.6L5.7 21.4 8 14 2 9.4h7.6z"/>
      </svg>
      <span>✨ Gerar versão IA</span>
    </button>

    <button class="btn btn-ai" id="aiBtn" disabled
            style="background:linear-gradient(135deg,#0EA5E9,#6366F1)"
            aria-label="Recortar fundo com IA">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4-6.3-4.6L5.7 21.4 8 14 2 9.4h7.6z"/>
      </svg>
      <span>✂️ Recortar fundo</span>
    </button>

    <button class="btn btn-primary" id="downloadBtn" disabled
            aria-label="Salvar ou compartilhar imagem final">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
        <path d="M17 21v-8H7v8M7 3v5h8"/>
      </svg>
      <span>Salvar / Compartilhar</span>
    </button>

    <button class="btn btn-ghost" id="resetBtn" style="display:none"
            aria-label="Remover foto atual">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
      </svg>
      <span>Remover foto</span>
    </button>

  </div>
</div>

<div class="toast" id="toast" role="alert" aria-live="assertive"></div>

<script type="module" src="js/ai.js"></script>
<script src="js/utils.js"></script>
<script src="js/toast.js"></script>
<script src="js/frames.js"></script>
<script src="js/editor.js"></script>
<script src="js/gestures.js"></script>
<script src="js/camera.js"></script>
<script src="js/share.js"></script>
<script src="js/generator.js"></script>
<script src="js/app.js"></script>

</body>
</html>
